moveit_simple_controller_manager:
  controller_names: [humanoid_trajectory_controller]
  humanoid_trajectory_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints: [waist_joint, neck_joint, left_shoulder_pitch, left_shoulder_roll, left_elbow, right_shoulder_pitch, right_shoulder_roll, right_elbow, left_hip_yaw, left_hip_roll, left_hip_pitch, left_knee, left_ankle_pitch, right_hip_yaw, right_hip_roll, right_hip_pitch, right_knee, right_ankle_pitch]
